<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVU Student Sign In</title>
  <link rel="stylesheet" href="SVUdashboard.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="logo-wrapper">
        <img
          src="SVU-LOGO.webp"
          alt="SVU College Logo"
          class="logo"
        />
      </div>
      <div class="title-wrapper">
        <h1>SVU Student Portal</h1>
        <p>Sign in to continue to your student space</p>
      </div>
    </header>

    <main>
      <section class="card">
        <div id="apiStatus" style="margin-bottom: 12px; color: #a8b4ff; font-weight: 600;">API host: <span id="apiHost">loading...</span></div>
        <h2 class="card-title">Student Sign In</h2>

        <form class="form" id="signinForm">
          <div class="form-group">
            <label for="signinRegNumber">College Registration Number</label>
            <input
              type="text"
              id="signinRegNumber"
              name="signinRegNumber"
              placeholder="Enter your registration number"
              required
            />
          </div>

          <div class="form-group">
            <label for="signinEmail">Your Email (Gmail)</label>
            <input
              type="email"
              id="signinEmail"
              name="signinEmail"
              placeholder="yourname@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="signinPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signinPassword"
                name="signinPassword"
                placeholder="Your password"
                required
              />
              <button type="button" class="password-toggle" id="signinPasswordToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p style="margin-top: 8px; font-size: 0.85rem; color: #9ca3af;">
          <button id="forgotPasswordLink" type="button" style="background:none;border:none;color:#60a5fa;text-decoration:underline;cursor:pointer;padding:0;">
            Forgot password?
          </button>
        </p>

        <form class="form" id="forgotForm" style="display: none; margin-top: 10px;">
          <div class="form-group">
            <label for="forgotEmail">Enter your registered Email (Gmail)</label>
            <input
              type="email"
              id="forgotEmail"
              name="forgotEmail"
              placeholder="yourname@gmail.com"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Send OTP</button>
        </form>

        <form class="form" id="resetForm" style="display: none; margin-top: 10px;">
          <div class="form-group">
            <label for="otp">Enter 4‑digit OTP</label>
            <input
              type="text"
              id="otp"
              name="otp"
              maxlength="4"
              placeholder="e.g. 1234"
              required
            />
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                minlength="6"
                placeholder="Enter new password"
                required
              />
              <button type="button" class="password-toggle" id="newPasswordToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Change Password</button>
        </form>

        <p style="margin-top: 10px; font-size: 0.85rem; color: #9ca3af;">
          New student?
          <a href="SVUsingup.html" style="color: #60a5fa; text-decoration: underline;">Create an account</a>.
        </p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 SVU College. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const apiHostLabel = document.getElementById("apiHost");
    if (apiHostLabel) apiHostLabel.textContent = API_BASE;
    const signinForm = document.getElementById("signinForm");
    const forgotForm = document.getElementById("forgotForm");
    const resetForm = document.getElementById("resetForm");
    const forgotLink = document.getElementById("forgotPasswordLink");

    let forgotEmailCache = "";

    // PASSWORD VISIBILITY TOGGLE FUNCTION
    function togglePasswordVisibility(toggle, input) {
      toggle.addEventListener("click", (e) => {
        e.preventDefault();
        const eyeIcon = toggle.querySelector(".eye-icon");
        const eyeOffIcon = toggle.querySelector(".eye-off-icon");

        if (input.type === "password") {
          input.type = "text";
          eyeIcon.style.display = "none";
          eyeOffIcon.style.display = "block";
        } else {
          input.type = "password";
          eyeIcon.style.display = "block";
          eyeOffIcon.style.display = "none";
        }
      });
    }

    // Setup password toggle for signin
    const signinPasswordToggle = document.getElementById("signinPasswordToggle");
    const signinPasswordInput = document.getElementById("signinPassword");
    if (signinPasswordToggle && signinPasswordInput) {
      togglePasswordVisibility(signinPasswordToggle, signinPasswordInput);
    }

    // Setup password toggle for reset form
    const newPasswordToggle = document.getElementById("newPasswordToggle");
    const newPasswordInput = document.getElementById("newPassword");
    if (newPasswordToggle && newPasswordInput) {
      togglePasswordVisibility(newPasswordToggle, newPasswordInput);
    }

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        regNumber: document.getElementById("signinRegNumber").value.trim(),
        email: document.getElementById("signinEmail").value.trim(),
        password: document.getElementById("signinPassword").value,
      };

      try {
        const res = await fetch(`${API_BASE}/signin`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          alert("Sign in successful. Welcome back!");
          // Use absolute path so it works from any URL
          window.location.assign("/SVUdashboard.html");
        } else {
          const errorData = await res.json().catch(() => ({}));
          alert(errorData.message || "Could not sign in. Please check your details.");
        }
      } catch (err) {
        alert("Server not running. Please start the backend server first.");
        console.error(err);
      }
    });

    forgotLink.addEventListener("click", () => {
      forgotForm.style.display = "flex";
      resetForm.style.display = "none";
    });

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("forgotEmail").value.trim();
      forgotEmailCache = email;

      try {
        const res = await fetch(`${API_BASE}/forgot-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email }),
        });

        const raw = await res.text();
        let data = {};
        let fallbackMessage = "";
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (_) {
          fallbackMessage = raw ? raw.trim() : "";
        }

        if (res.ok) {
          alert("OTP sent to your email. Please check your inbox.");
          forgotForm.style.display = "none";
          resetForm.style.display = "flex";
        } else {
          alert(data.message || fallbackMessage || "Unable to send OTP. Please try again.");
        }
      } catch (err) {
        alert("Server not running. Please start the backend server first.");
        console.error(err);
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const otp = document.getElementById("otp").value.trim();
      const newPassword = document.getElementById("newPassword").value;

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email: forgotEmailCache, otp, newPassword }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          alert("Password reset successful. You can now sign in with your new password.");
          resetForm.reset();
          forgotForm.reset();
          resetForm.style.display = "none";
        } else {
          alert(data.message || "Could not reset password. Please try again.");
        }
      } catch (err) {
        alert("Server not running. Please start the backend server first.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
