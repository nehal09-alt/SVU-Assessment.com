<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVU Student Sign In</title>
  <link rel="stylesheet" href="SVUdashboard.css" />
  <style>
    /* Remove hover effects for sign-in page */
    .btn-primary:hover,
    .btn-secondary:hover,
    .card:hover,
    .glass-card:hover {
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-futuristic:hover::before {
      left: -100% !important;
    }
  </style>
  <script>
    (function redirectToAppPort() {
      const isLocalHost = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
      if (isLocalHost && (!window.location.port || window.location.port !== "3010")) {
        const target = `http://localhost:3010${window.location.pathname}${window.location.search}${window.location.hash}`;
        window.location.replace(target);
      }
    })();
  </script>
  <script>
    (function initThemeBootstrap() {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("svuTheme");
      } catch (_) {
        savedTheme = null;
      }

      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const useDark = savedTheme ? savedTheme === "dark" : prefersDark;
      document.documentElement.classList.toggle("theme-dark", useDark);
    })();
  </script>
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="logo-wrapper">
        <img src="SVU-LOGO.webp" alt="SVU College Logo" class="logo" />
      </div>
      <div class="title-wrapper">
        <h1>SVU Student Portal</h1>
        <p>Sign in to continue to your student space</p>
      </div>
    </header>

    <main>
      <section class="card glass-card">
        <h2 class="card-title">Student Sign In</h2>

        <form class="form" id="signinForm">
          <div class="form-group">
            <label for="signinRegNumber">College Registration Number</label>
            <input
              type="text"
              id="signinRegNumber"
              name="signinRegNumber"
              placeholder="Enter your registration number"
              required
            />
            <small>Use the same registration number that was saved during signup.</small>
          </div>

          <div class="form-group">
            <label for="signinEmail">Your Email (Gmail)</label>
            <input
              type="email"
              id="signinEmail"
              name="signinEmail"
              placeholder="yourname@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="signinPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signinPassword"
                name="signinPassword"
                placeholder="Your password"
                required
              />
              <button type="button" class="password-toggle" id="signinPasswordToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p style="margin-top: 8px; font-size: 0.85rem; color: #9ca3af;">
          <button id="forgotPasswordLink" type="button" style="background:none;border:none;color:#60a5fa;text-decoration:underline;cursor:pointer;padding:0;">
            Forgot password?
          </button>
        </p>

        <form class="form" id="forgotForm" style="display: none; margin-top: 10px;">
          <div class="form-group">
            <label for="forgotEmail">Enter your registered Email (Gmail)</label>
            <input
              type="email"
              id="forgotEmail"
              name="forgotEmail"
              placeholder="yourname@gmail.com"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Send OTP</button>
        </form>

        <form class="form" id="resetForm" style="display: none; margin-top: 10px;">
          <div class="form-group">
            <label for="otp">Enter 4-digit OTP</label>
            <input
              type="text"
              id="otp"
              name="otp"
              maxlength="4"
              placeholder="e.g. 1234"
              required
            />
          </div>

          <div class="form-group" id="otpHelper" style="display:none;">
            <small style="color:#38bdf8; display:block; margin-bottom:6px;">OTP expires in <span id="otpTimer">02:00</span>.</small>
            <button type="button" id="resendOtpBtn" class="btn-secondary" style="background:#334155; border-color:#475569;">Resend OTP</button>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                minlength="6"
                placeholder="Enter new password"
                required
              />
              <button type="button" class="password-toggle" id="newPasswordToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Change Password</button>
        </form>

        <p style="margin-top: 10px; font-size: 0.85rem; color: #9ca3af;">
          New student?
          <a href="SVUsingup.html" style="color: #60a5fa; text-decoration: underline;">Create an account</a>.
        </p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 SVU College. All rights reserved.</p>
    </footer>
  </div>

  <script src="svu-common.js"></script>
  <script>
    const AUTH_KEY = "svuAuthSession";
    const API_BASE = window.SVUCommon.getApiBase();
    const getFriendlyError = window.SVUCommon.getFriendlyError;
    const signinForm = document.getElementById("signinForm");
    const forgotForm = document.getElementById("forgotForm");
    const resetForm = document.getElementById("resetForm");
    const forgotLink = document.getElementById("forgotPasswordLink");

    let forgotEmailCache = "";
    let otpTimerInterval = null;
    let otpRemainingSeconds = 0;
    let otpExpiresAtIso = "";

    const otpHelper = document.getElementById("otpHelper");
    const otpTimerDisplay = document.getElementById("otpTimer");
    const resendOtpBtn = document.getElementById("resendOtpBtn");

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function otpHelperSetMessage(text) {
      if (!otpHelper) return;
      const smallEl = otpHelper.querySelector("small");
      if (smallEl) smallEl.textContent = text;
    }

    function clearOtpCountdown(showExpiredMessage = true) {
      if (otpTimerInterval) {
        clearInterval(otpTimerInterval);
        otpTimerInterval = null;
      }
      otpRemainingSeconds = 0;
      otpExpiresAtIso = "";
      if (otpTimerDisplay) {
        otpTimerDisplay.textContent = "00:00";
      }
      if (showExpiredMessage) {
        otpHelperSetMessage("OTP has expired. Please click Resend OTP to get a new code.");
      }
      if (resendOtpBtn) {
        resendOtpBtn.disabled = false;
      }
    }

    function startOtpCountdown(expiresAt) {
      if (expiresAt) {
        otpExpiresAtIso = expiresAt;
      }

      const expiryMs = otpExpiresAtIso ? new Date(otpExpiresAtIso).getTime() : NaN;
      if (Number.isFinite(expiryMs)) {
        otpRemainingSeconds = Math.max(0, Math.ceil((expiryMs - Date.now()) / 1000));
      } else {
        otpRemainingSeconds = 300;
      }

      otpHelperSetMessage("OTP expires in " + formatTime(otpRemainingSeconds) + ".");

      if (otpTimerDisplay) {
        otpTimerDisplay.textContent = formatTime(otpRemainingSeconds);
      }

      if (otpTimerInterval) {
        clearInterval(otpTimerInterval);
      }

      otpTimerInterval = setInterval(() => {
        const nextRemaining = Number.isFinite(expiryMs)
          ? Math.max(0, Math.ceil((expiryMs - Date.now()) / 1000))
          : Math.max(0, otpRemainingSeconds - 1);
        otpRemainingSeconds = nextRemaining;
        if (otpTimerDisplay) {
          otpTimerDisplay.textContent = formatTime(otpRemainingSeconds);
        }

        if (otpRemainingSeconds <= 0) {
          clearOtpCountdown();
        }
      }, 1000);
    }

    if (resendOtpBtn) {
      resendOtpBtn.addEventListener("click", async (evt) => {
        evt.preventDefault();
        evt.stopPropagation();

        if (!forgotEmailCache) {
          return alert("Enter your email and send OTP first.");
        }

        if (resendOtpBtn.disabled) return;
        resendOtpBtn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/resend-otp`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email: forgotEmailCache }),
          });

          if (res.ok) {
            if (otpTimerInterval) {
              clearInterval(otpTimerInterval);
              otpTimerInterval = null;
            }

            const result = await res.json().catch(() => ({}));
            alert(result.message || "A new OTP has been sent to your email.");
            startOtpCountdown(result.expiresAt || "");
            if (otpHelper) otpHelper.style.display = "block";
          } else {
            const errorMsg = await getFriendlyError(res);
            alert(errorMsg);
            console.error("Resend OTP failed:", errorMsg);
          }
        } catch (err) {
          alert("Could not connect to the backend API. Please start the server on port 3010 and try again.");
          console.error("Resend OTP error:", err);
        } finally {
          resendOtpBtn.disabled = false;
        }
      });
    }

    function readAuth() {
      try {
        return JSON.parse(sessionStorage.getItem(AUTH_KEY) || "null");
      } catch (_) {
        return null;
      }
    }

    function writeAuth(auth) {
      sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    }

    if (readAuth()) {
      window.location.replace("/SVUdashboard.html");
    }

    function togglePasswordVisibility(toggle, input) {
      toggle.addEventListener("click", (e) => {
        e.preventDefault();
        const eyeIcon = toggle.querySelector(".eye-icon");
        const eyeOffIcon = toggle.querySelector(".eye-off-icon");

        if (input.type === "password") {
          input.type = "text";
          eyeIcon.style.display = "none";
          eyeOffIcon.style.display = "block";
        } else {
          input.type = "password";
          eyeIcon.style.display = "block";
          eyeOffIcon.style.display = "none";
        }
      });
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim().toLowerCase());
    }

    const signinPasswordToggle = document.getElementById("signinPasswordToggle");
    const signinPasswordInput = document.getElementById("signinPassword");
    if (signinPasswordToggle && signinPasswordInput) {
      togglePasswordVisibility(signinPasswordToggle, signinPasswordInput);
    }

    const newPasswordToggle = document.getElementById("newPasswordToggle");
    const newPasswordInput = document.getElementById("newPassword");
    if (newPasswordToggle && newPasswordInput) {
      togglePasswordVisibility(newPasswordToggle, newPasswordInput);
    }

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        regNumber: document.getElementById("signinRegNumber").value.trim(),
        email: document.getElementById("signinEmail").value.trim(),
        password: document.getElementById("signinPassword").value,
      };

      if (!data.regNumber) {
        alert("Please enter your registration number.");
        return;
      }

      if (!isValidEmail(data.email)) {
        alert("Please enter a valid email address.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/signin`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const result = await res.json().catch(() => ({}));

        if (res.ok) {
          const profile = result.profile || {};

          writeAuth({
            regNumber: profile.regNumber || "",
            email: profile.email || data.email.toLowerCase(),
            studentName: profile.studentName || result.studentName || "",
            admitNumber: profile.admitNumber || "",
            course: profile.course || "",
            year: profile.year || "",
            semester: profile.semester || "",
            passwordStatus: profile.passwordStatus || "hidden",
            profilePhoto: result.profilePhoto || profile.profilePhoto || "",
            profileToken: result.profileToken || "",
            assignmentSummary: result.assignmentSummary || null,
            signedInAt: new Date().toISOString(),
          });

          alert("Sign in successful. Welcome back!");
          window.location.assign("/SVUdashboard.html");
        } else {
          console.error("Login failed:", { status: res.status, result });
          alert(result.message || await getFriendlyError(res));
        }
      } catch (err) {
        alert("Could not connect to the backend API. Please start the server on port 3010 and try again.");
        console.error(err);
      }
    });

    forgotLink.addEventListener("click", () => {
      forgotForm.style.display = "flex";
      resetForm.style.display = "none";
      document.getElementById("forgotEmail").focus();
    });

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("forgotEmail").value.trim().toLowerCase();
      forgotEmailCache = email;

      try {
        const res = await fetch(`${API_BASE}/forgot-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email }),
        });

        if (res.ok) {
          const result = await res.json().catch(() => ({}));
          alert(result.message || "OTP sent to your email. Please check your inbox.");
          forgotForm.style.display = "none";
          resetForm.style.display = "flex";
          document.getElementById("otp").focus();
          startOtpCountdown(result.expiresAt || "");
          otpHelper.style.display = "block";
        } else {
          const err = await getFriendlyError(res);
          console.error("Forgot password API failed:", res.status, err);
          alert(err);
        }
      } catch (err) {
        console.error("Forgot password fetch error:", err.message);
        alert("Could not connect to the backend API. Please start the server on port 3010 and try again.");
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const otp = document.getElementById("otp").value.trim();
      const newPassword = document.getElementById("newPassword").value;

      if (!otp || otp.length !== 4) {
        alert("Please enter a valid 4-digit OTP");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            email: (forgotEmailCache || "").toLowerCase(),
            otp,
            newPassword,
          }),
        });

        if (res.ok) {
          const result = await res.json().catch(() => ({}));
          // Check if auto signin occurred (response includes profile data)
          if (result.profile && result.profileToken) {
            // Auto signin successful - save auth and redirect
            writeAuth({
              regNumber: result.profile.regNumber || "",
              email: forgotEmailCache,
              studentName: result.profile.studentName || "",
              admitNumber: result.profile.admitNumber || "",
              course: result.profile.course || "",
              year: result.profile.year || "",
              semester: result.profile.semester || "",
              passwordStatus: result.profile.passwordStatus || "hidden",
              profilePhoto: result.profilePhoto || "",
              profileToken: result.profileToken || "",
              assignmentSummary: result.assignmentSummary || null,
              signedInAt: new Date().toISOString(),
            });
            
            alert("Password reset successful. You are now signed in!");
            window.location.assign("/SVUdashboard.html");
          } else {
            // Regular password reset - user needs to sign in manually
            alert("Password reset successful. You can now sign in with your new password.");
            resetForm.reset();
            forgotForm.reset();
            resetForm.style.display = "none";
            clearOtpCountdown(false);
            if (otpHelper) {
              otpHelper.style.display = "none";
            }
          }
        } else {
          const errorMsg = await getFriendlyError(res);
          console.error("Password reset failed:", { status: res.status, error: errorMsg });
          alert(errorMsg);
        }
      } catch (err) {
        alert("Could not connect to the backend API. Please start the server on port 3010 and try again.");
        console.error("Password reset error:", err);
      }
    });
  </script>
  <script>window.SVUCommon.setupThemeToggle();</script>
</body>
</html>
